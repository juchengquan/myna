name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories appear without code changes, so re-audit every week.
    - cron: "0 6 * * 1"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov=myna --cov-report=term-missing

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t myna:ci .

      - name: Start with production settings
        run: |
          docker run -d --name myna -p 8000:8000 \
            -e MYNA_ENV=production \
            -e MYNA_ADMIN_API_KEY=ci-admin \
            -e MYNA_METRICS_API_KEY=ci-metrics \
            -e MYNA_MCP_API_KEYS=ci:ci-key \
            -e MYNA_MCP_ALLOWED_HOSTS='["myna.test"]' \
            myna:ci

      - name: Wait for health check
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 1
          done
          docker logs myna
          exit 1

      - name: Check authenticated MCP request
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp/ \
            -H 'Host: myna.test' \
            -H 'Authorization: Bearer ci-key' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"ping"}')
          echo "POST /mcp/ returned $status"
          test "$status" = 200

      - name: Check SQLite keys on a named volume
        run: scripts/check_image_sqlite.sh myna:ci myna-ci-data:/data

      - name: Check SQLite keys on a bind mount
        run: |
          mkdir keys-data
          sudo chown 1000:1000 keys-data
          scripts/check_image_sqlite.sh myna:ci "$PWD/keys-data:/data"

  postgres:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: myna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run key store tests on PostgreSQL
        env:
          MYNA_TEST_POSTGRES_URL: postgresql://postgres:ci-only@localhost:5432/myna_test
        run: uv run pytest tests/keys

  template:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run the README's new-server steps
        run: |
          sed -n '/^## Start a new server/,/^## Configuration/p' README.md \
            | awk '/^```bash$/{f=1;next} /^```$/{f=0} f' > "$RUNNER_TEMP/start.sh"
          bash -ex "$RUNNER_TEMP/start.sh"

      - name: Check the result
        run: |
          test -z "$(git grep -il myna)"
          uv run ruff check .
          uv run mypy src

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Export runtime dependencies
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-audit.txt

      - name: Audit for known vulnerabilities
        run: uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip
